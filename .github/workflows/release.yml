name: Release

on:
  push:
    tags:
      - "v*"

env:
  FLUTTER_VERSION: "3.24.x"

jobs:
  extract-version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Find the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "changelog=First release. See commit history for all changes." >> $GITHUB_OUTPUT
          else
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    needs: extract-version
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Prepare release zip
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath "alist-to-hf-migrator-${{ needs.extract-version.outputs.version }}-windows-x64.zip"
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/alist-to-hf-migrator-${{ needs.extract-version.outputs.version }}-windows-x64.zip
          retention-days: 7

  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    needs: extract-version
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            "alist-to-hf-migrator-${{ needs.extract-version.outputs.version }}-android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: alist-to-hf-migrator-${{ needs.extract-version.outputs.version }}-android.apk
          retention-days: 7

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [extract-version, build-windows, build-android]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ needs.extract-version.outputs.version }}"
          body: |
            ## Alist-To-HF Migrator v${{ needs.extract-version.outputs.version }}

            ### Changes
            ${{ needs.extract-version.outputs.changelog }}

            ### Downloads
            - **Windows (x64):** `alist-to-hf-migrator-${{ needs.extract-version.outputs.version }}-windows-x64.zip`
            - **Android (APK):** `alist-to-hf-migrator-${{ needs.extract-version.outputs.version }}-android.apk`

            ### Installation
            - **Windows:** Extract the zip and run `alist_to_hf_migrator.exe`
            - **Android:** Install the APK on your device
          files: |
            artifacts/windows-release/*.zip
            artifacts/android-release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
