name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Custom version tag (e.g. 1.2.3)"
        required: false
        type: string
      flutter_version:
        description: "Flutter SDK version"
        required: false
        default: "3.24.x"
        type: string

env:
  FLUTTER_VERSION: "3.24.x"

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set custom Flutter version if provided
        if: inputs.flutter_version != ''
        run: echo "FLUTTER_VERSION=${{ inputs.flutter_version }}" >> $env:GITHUB_ENV

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Prepare release zip
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath alist-to-hf-migrator-windows-x64.zip
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: alist-to-hf-migrator-windows-x64
          path: build/windows/x64/runner/Release/alist-to-hf-migrator-windows-x64.zip
          retention-days: 14
          if-no-files-found: error

  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set custom Flutter version if provided
        if: inputs.flutter_version != ''
        run: echo "FLUTTER_VERSION=${{ inputs.flutter_version }}" >> $GITHUB_ENV

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alist-to-hf-migrator-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    if: always()

    steps:
      - name: Check build results
        run: |
          echo "========================================="
          echo "  Alist-To-HF Migrator - Build Summary  "
          echo "========================================="
          echo ""
          echo "Windows (x64):  ${{ needs.build-windows.result }}"
          echo "Android  (APK): ${{ needs.build-android.result }}"
          echo ""
          if [[ "${{ needs.build-windows.result }}" == "success" && "${{ needs.build-android.result }}" == "success" ]]; then
            echo "All builds passed!"
          else
            echo "Some builds failed. Check the jobs above for details."
            exit 1
          fi
